      - 第14回 ラムダと高階関数: lessons/lesson-14.md
      - 第15回 クラス入門: lessons/lesson-15.md
      - 第16回 Jupyter／セル実行: lessons/lesson-16.md
      - 第17回 読みやすいコード: lessons/lesson-17.md
      - 第18回 デバッグの基礎: lessons/lesson-18.md
      - 第19回 仮想環境とパッケージ管理: lessons/lesson-19.md
