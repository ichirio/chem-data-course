site_name: 化学データ分析コース（Python主・R副）
site_description: 化学専攻の学生が、1回1テーマで初歩からPythonとRを学ぶ全100回コース
site_author: ichirio
site_url: https://ichirio.github.io/chem-data-course/
repo_url: https://github.com/ichirio/chem-data-course

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: ja

nav:
  - はじめに: index.md
  - ロードマップ（全100回）: roadmap.md
  - 第1部　はじめの一歩:
      - 第1回 開発環境の構築: lessons/lesson-01.md
      - 第2回 はじめてのPython: lessons/lesson-02.md
      - 第3回 リストと辞書で化学を扱う: lessons/lesson-03.md
      - 第4回 条件分岐（if）: lessons/lesson-04.md
      - 第5回 繰り返し（for / while）: lessons/lesson-05.md
      - 第6回 関数をつくる: lessons/lesson-06.md
      - 第7回 GitとGitHub: lessons/lesson-07.md
      - 第8回 まとめ演習：分子量電卓: lessons/lesson-08.md
  - 第2部　Pythonの基礎:
      - 第9回 文字列操作: lessons/lesson-09.md
      - 第10回 エラーと例外処理: lessons/lesson-10.md
  - 第4部　データ処理とpandas:
      - 第31回 pandas入門・DataFrame: lessons/lesson-31.md
      - 第32回 CSVを読み込む・書き出す: lessons/lesson-32.md
      - 第33回 行と列の選択（loc / iloc）: lessons/lesson-33.md
      - 第34回 フィルタリングと条件抽出: lessons/lesson-34.md
      - 第35回 欠損値の扱い: lessons/lesson-35.md
      - 第36回 並べ替えと集計（groupby）: lessons/lesson-36.md
      - 第37回 列の追加・計算・変換: lessons/lesson-37.md
      - 第38回 複数データの結合（merge / concat）: lessons/lesson-38.md
      - 第39回 ピボットテーブルとクロス集計: lessons/lesson-39.md
      - 第40回 日付・時刻データの扱い: lessons/lesson-40.md
      - 第41回 実験データの前処理レシピ: lessons/lesson-41.md
      - 第42回 外れ値の検出: lessons/lesson-42.md
      - 第43回 正規化・標準化: lessons/lesson-43.md
      - 第44回 Excelの読み書き: lessons/lesson-44.md
      - 第45回 まとめ演習：実験ノート分析: lessons/lesson-45.md
  - 第5部　データ可視化:
      - 第46回 matplotlib入門: lessons/lesson-46.md
      - 第47回 折れ線・散布図・棒グラフ: lessons/lesson-47.md
      - 第48回 ヒストグラムと分布: lessons/lesson-48.md
      - 第49回 複数グラフとサブプロット: lessons/lesson-49.md
      - 第50回 グラフの装飾: lessons/lesson-50.md
      - 第51回 seabornで統計グラフ: lessons/lesson-51.md
      - 第52回 相関のヒートマップ: lessons/lesson-52.md
      - 第53回 箱ひげ図・バイオリン: lessons/lesson-53.md
      - 第54回 論文品質の図をつくる: lessons/lesson-54.md
      - 第55回 まとめ演習：反応速度の可視化: lessons/lesson-55.md
