site_name: 化学データ分析コース（Python主・R副）
site_description: 化学専攻の学生が、1回1テーマで初歩からPythonとRを学ぶ全100回コース
site_author: ichirio
site_url: https://ichirio.github.io/chem-data-course/
repo_url: https://github.com/ichirio/chem-data-course

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: ja

nav:
  - はじめに: index.md
  - ロードマップ（全100回）: roadmap.md
  - 第1部　はじめの一歩:
      - 第1回 開発環境の構築: lessons/lesson-01.md
      - 第2回 はじめてのPython: lessons/lesson-02.md
      - 第3回 リストと辞書で化学を扱う: lessons/lesson-03.md
      - 第4回 条件分岐（if）: lessons/lesson-04.md
      - 第5回 繰り返し（for / while）: lessons/lesson-05.md
      - 第6回 関数をつくる: lessons/lesson-06.md
      - 第7回 GitとGitHub: lessons/lesson-07.md
      - 第8回 まとめ演習：分子量電卓: lessons/lesson-08.md
  - 第2部　Pythonの基礎:
      - 第9回 文字列操作: lessons/lesson-09.md
      - 第10回 エラーと例外処理: lessons/lesson-10.md
      - 第11回 モジュールとimport（math）: lessons/lesson-11.md
      - 第12回 ファイルの読み書き: lessons/lesson-12.md
